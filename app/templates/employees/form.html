{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">Employee</p><h1>{{ title }}</h1></div></div>
<form class="form-card" method="post">
  <div class="form-grid">
    <label>Employee Code *<input name="employee_code" value="{{ employee.employee_code if employee else '' }}" required></label>
    <label>First Name *<input name="first_name" value="{{ employee.first_name if employee else '' }}" required></label>
    <label>Last Name *<input name="last_name" value="{{ employee.last_name if employee else '' }}" required></label>
    <label>Email *<input type="email" name="email" value="{{ employee.email if employee else '' }}" required></label>
    <label>Phone<input name="phone" value="{{ employee.phone if employee else '' }}"></label>
    <label>Designation *<input name="designation" value="{{ employee.designation if employee else '' }}" required></label>
    <label>Salary *<input type="number" step="0.01" min="0" name="salary" value="{{ employee.salary if employee else 0 }}" required></label>
    <label>Joining Date *<input type="date" name="joining_date" value="{{ employee.joining_date.isoformat() if employee and employee.joining_date else '' }}" required></label>
    <label>Department *<select name="department_id" required>{% for d in departments %}<option value="{{ d.id }}" {% if employee and employee.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></label>
    <label>Status *<select name="status"><option {% if employee and employee.status == 'Active' %}selected{% endif %}>Active</option><option {% if employee and employee.status == 'Inactive' %}selected{% endif %}>Inactive</option></select></label>
  </div>
  <div class="actions"><button class="button" type="submit">Save Employee</button><a class="button secondary" href="{{ url_for('employees.list_employees') }}">Cancel</a></div>
</form>
{% endblock %}
